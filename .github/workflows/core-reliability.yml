name: Dungeon Dot — Core Reliability
on:
  push:
    branches: [main]
  pull_request:

jobs:
  reliability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run gameplay regression suite
        run: node --test tests/core-reliability.test.cjs
