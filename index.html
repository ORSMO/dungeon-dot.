<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#191724"><title>Dungeon Dot — Heavy Bat</title><style>*{box-sizing:border-box}body{margin:0;background:#11101a;color:#eee;font:14px system-ui;display:flex;align-items:center;justify-content:center;min-height:100dvh}main{width:min(100vw,470px);padding:8px}header{display:flex;justify-content:space-between;margin:4px 4px 8px}canvas{width:100%;height:auto;display:block;touch-action:none;border-radius:12px}footer{display:flex;align-items:center;justify-content:space-between;padding:10px 4px}button{border:0;background:#504365;color:white;border-radius:8px;padding:10px 16px}small{color:#bdb3cc}</style></head><body><main><header><b id="hp">♥ ♥ ♥</b><b id="kills">KILLS 0</b></header><canvas id="game" width="360" height="406"></canvas><footer><small>LEFT · MOVE &nbsp; RIGHT · HEAVY BAT</small><button id="restart">Restart</button></footer></main><script>
(()=>{const c=document.querySelector('#game'),g=c.getContext('2d'),W=360,H=406,F=285,R=42,sticks=[{x:89,y:345,dx:0,dy:0,id:null},{x:271,y:345,dx:0,dy:0,id:null}];let p,enemies,hp,kills,inv,over,last=0,spawnClock=0;
function spawn(){let x=28+Math.random()*304,y=28+Math.random()*225;if(Math.hypot(x-p.x,y-p.y)<95){x=x<180?28:332;y=y<145?28:257}enemies.push({x,y,hp:3,cool:0})}
function reset(){p={x:180,y:140,a:-Math.PI/2,target:-Math.PI/2,vel:0};enemies=[];hp=3;kills=0;inv=0;over=false;spawnClock=0;sticks.forEach(s=>{s.id=null;s.dx=s.dy=0});for(let i=0;i<5;i++)spawn();hud()}
function hud(){document.querySelector('#hp').textContent='♥ '.repeat(Math.max(0,hp));document.querySelector('#kills').textContent='KILLS '+kills}
function pt(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function setStick(s,v){let dx=v.x-s.x,dy=v.y-s.y,d=Math.hypot(dx,dy),k=d?Math.min(d,R)/d/R:0;s.dx=dx*k;s.dy=dy*k}
c.addEventListener('pointerdown',e=>{e.preventDefault();let v=pt(e),s=sticks[v.x<W/2?0:1];if(s.id!==null)return;s.id=e.pointerId;c.setPointerCapture(e.pointerId);setStick(s,v)});
c.addEventListener('pointermove',e=>{let s=sticks.find(s=>s.id===e.pointerId);if(s){e.preventDefault();setStick(s,pt(e))}});
function up(e){let s=sticks.find(s=>s.id===e.pointerId);if(s){s.id=null;s.dx=s.dy=0}}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);document.querySelector('#restart').onclick=reset;
function frame(t){let dt=Math.min((t-last)/1000||0,.04);last=t;if(!over){let l=sticks[0],r=sticks[1];p.x=Math.max(23,Math.min(W-23,p.x+l.dx*118*dt));p.y=Math.max(23,Math.min(F-23,p.y+l.dy*118*dt));if(Math.hypot(r.dx,r.dy)>.15)p.target=Math.atan2(r.dy,r.dx);
let diff=Math.atan2(Math.sin(p.target-p.a),Math.cos(p.target-p.a));let force=Math.sign(diff)*Math.min(1,Math.abs(diff)*1.6);let acceleration=force*17-p.vel*2.5;p.vel+=acceleration*dt;p.vel=Math.max(-6.7,Math.min(6.7,p.vel));if(Math.abs(diff)<.045&&Math.abs(p.vel)<.14)p.vel=0;p.a+=p.vel*dt;inv=Math.max(0,inv-dt);
for(let e of enemies){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.cool=Math.max(0,e.cool-dt);if(d>15){e.x+=dx/d*28*dt;e.y+=dy/d*28*dt}if(d<17&&inv===0){hp--;inv=1.1;if(hp<=0)over=true}
let vx=e.x-p.x,vy=e.y-p.y,along=vx*Math.cos(p.a)+vy*Math.sin(p.a),across=Math.abs(-vx*Math.sin(p.a)+vy*Math.cos(p.a));if(along>16&&along<50&&across<11&&e.cool===0&&Math.abs(p.vel)>1.2){e.hp-=Math.abs(p.vel)>4?2:1;e.cool=.48}}
let before=enemies.length;enemies=enemies.filter(e=>e.hp>0);kills+=before-enemies.length;spawnClock+=dt;if(enemies.length<5&&spawnClock>.45){spawn();spawnClock=0}hud()}
g.fillStyle='#191724';g.fillRect(0,0,W,H);for(let y=14;y<F-10;y+=25)for(let x=12;x<W-10;x+=25){g.fillStyle=((x+y)/25|0)%2?'#272438':'#2d293e';g.fillRect(x,y,24,24)}g.strokeStyle='#746383';g.lineWidth=9;g.strokeRect(8,8,W-16,F-16);
for(let e of enemies){g.fillStyle=e.cool>0?'#ffb2a9':'#ec5274';g.fillRect(e.x-8,e.y-8,16,16);g.fillStyle='#371e36';g.fillRect(e.x-4,e.y-3,3,3);g.fillRect(e.x+3,e.y-3,3,3)}
if(inv===0||Math.floor(t/110)%2===0){g.fillStyle='#fff';g.beginPath();g.arc(p.x,p.y,9,0,Math.PI*2);g.fill()}
g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle='#fff';g.fillRect(17,-3,31,6);g.fillStyle='#bdb7d5';g.fillRect(19,2,27,2);g.restore();
g.fillStyle='#11101c';g.fillRect(0,F,W,H-F);for(let i=0;i<2;i++){let s=sticks[i];g.beginPath();g.arc(s.x,s.y,R,0,Math.PI*2);g.fillStyle='#28263c';g.fill();g.strokeStyle=i?'#b8a6ed':'#7e90ad';g.lineWidth=2;g.stroke();g.beginPath();g.arc(s.x+s.dx*R,s.y+s.dy*R,19,0,Math.PI*2);g.fillStyle=i?'#a38bd2':'#7486a7';g.fill()}
g.textAlign='center';g.font='11px monospace';g.fillStyle='#c3bbd4';g.fillText('MOVE',89,402);g.fillText('BAT',271,402);
if(over){g.fillStyle='#100e1acc';g.fillRect(12,12,336,F-24);g.fillStyle='#fff';g.font='bold 22px monospace';g.fillText('GAME OVER',180,130);g.font='12px monospace';g.fillText('Kills '+kills,180,155)}
requestAnimationFrame(frame)}reset();requestAnimationFrame(frame)})();
</script></body></html>
